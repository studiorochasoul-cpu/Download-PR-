<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download music PRÓ</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Inline PWA Web Manifest -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkRvd25sb2FkIG11c2ljIFBSw5MiLAogICJzaG9ydF9uYW1lIjogIk11c2ljIFBSw5MiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzA3MGExMiIsCiAgInRoZW1lX2NvbG9yIjogIiMwNzBhMTIiCi99">

  <style>
    * {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #070a12;
      color: #f3f4f6;
    }
    .neon-btn {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }
    .neon-btn:hover {
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
    }
    .neon-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3);
    }
    @keyframes pulse-wave {
      0%, 100% { height: 3px; }
      50% { height: 18px; }
    }
    .wave-bar {
      height: 3px;
      transition: height 0.3s;
    }
    .wave-bar.animate-wave {
      animation: pulse-wave 0.6s ease-in-out infinite alternate;
    }
    .wave-bar.animate-wave:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar.animate-wave:nth-child(3) { animation-delay: 0.25s; }
    .wave-bar.animate-wave:nth-child(4) { animation-delay: 0.4s; }
    .wave-bar.animate-wave:nth-child(5) { animation-delay: 0.15s; }
    .wave-bar.animate-wave:nth-child(6) { animation-delay: 0.3s; }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full bg-[#070a12] overflow-hidden">

  <!-- Audio Element & Hidden YouTube Player Iframe -->
  <audio id="real-audio-element" class="hidden" preload="auto" crossorigin="anonymous" playsinline></audio>
  <div class="fixed top-0 left-0 -z-50 pointer-events-none opacity-0 w-1 h-1 overflow-hidden">
    <div id="yt-player-container">
      <iframe 
        id="yt-player-iframe" 
        src="https://www.youtube.com/embed/kJQP7kiw5Fk?enablejsapi=1&playsinline=1&controls=0" 
        allow="autoplay; encrypted-media" 
        class="w-full h-full"
      ></iframe>
    </div>
  </div>

  <!-- BANNER PWA DE INSTALAÇÃO -->
  <div id="pwa-banner" class="bg-gradient-to-r from-purple-900/90 to-indigo-900/90 border-b border-purple-500/30 px-3 py-1.5 flex items-center justify-between text-xs z-50 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded bg-red-600 flex items-center justify-center font-black text-[9px] text-white shadow">
        PRÓ
      </div>
      <span class="text-[11px] md:text-xs">Instalar <strong>Download music PRÓ</strong>?</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="installPWA()" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-2.5 py-0.5 rounded text-[11px] shadow">
        Instalar
      </button>
      <button onclick="closePWABanner()" class="text-slate-400 hover:text-white text-sm px-1">
        ✕
      </button>
    </div>
  </div>

  <!-- HEADER (Sem o ícone de usuário) -->
  <header class="px-4 md:px-8 py-2.5 flex items-center justify-center border-b border-slate-800/80 bg-[#0b101d] shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="relative w-8 h-8 md:w-9 md:h-9 rounded-lg bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center shadow-lg border border-red-500/30">
        <svg class="w-4 h-4 text-white fill-current ml-0.5" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <span class="absolute -bottom-1 -right-1 bg-purple-600 text-[7px] font-black px-1 rounded text-white border border-slate-900">PRÓ</span>
      </div>
      <div class="text-center md:text-left">
        <h1 class="text-sm md:text-base font-extrabold tracking-tight text-white leading-none">Download music <span class="text-purple-400">PRÓ</span></h1>
        <p class="text-[9px] md:text-[11px] text-slate-400">Extração de áudio do YouTube em alta qualidade</p>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (TELA ÚNICA SEM SCROLL / DESKTOP E MOBILE) -->
  <main class="flex-1 flex flex-col justify-between p-3 md:p-6 overflow-hidden max-w-3xl mx-auto w-full relative">

    <!-- CAMPO DE URL E BOTÃO COLAR -->
    <div class="shrink-0 w-full my-auto">
      <div class="relative flex items-center bg-[#121826] border border-purple-500/30 rounded-xl p-1.5 focus-within:border-purple-500 transition-all shadow-md">
        <span class="pl-2 pr-1 text-purple-400 text-xs md:text-sm">🔗</span>
        <input 
          type="text" 
          id="url-input" 
          placeholder="Cole o link do YouTube aqui..." 
          value="https://www.youtube.com/watch?v=kJQP7kiw5Fk"
          class="w-full bg-transparent text-xs md:text-sm text-white placeholder-slate-500 focus:outline-none px-1.5"
          oninput="handleUrlInputChange()"
        >
        <button 
          onclick="pasteFromClipboard()" 
          class="bg-purple-900/60 hover:bg-purple-800 text-purple-200 border border-purple-500/40 text-xs font-semibold px-3.5 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition-all shrink-0 cursor-pointer"
        >
          📋 Colar
        </button>
      </div>
    </div>

    <!-- SEÇÃO CENTRAL: GRID COM CAPA/PLAYER E CONTROLES DE QUALIDADE -->
    <div class="flex-1 flex flex-col md:flex-row items-center justify-center gap-3 md:gap-6 min-h-0 w-full my-auto py-2">
      
      <!-- CAPA DA MÚSICA COM BOTÃO DE PRÉ-ESCUTA REAL -->
      <div class="w-full md:w-1/2 flex flex-col items-center justify-center">
        <div class="relative w-full aspect-video max-h-[180px] md:max-h-[220px] rounded-2xl overflow-hidden bg-black border border-slate-800 flex items-center justify-center shadow-xl">
          <img 
            id="song-thumbnail" 
            src="https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" 
            alt="Capa da música" 
            class="w-full h-full object-cover"
            onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop'"
          >
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

          <!-- Botão Ouvir Música -->
          <button 
            id="btn-play-preview"
            onclick="toggleAudioPreview()" 
            class="absolute z-10 bg-purple-600/90 hover:bg-purple-500 text-white rounded-full px-4 py-2 md:px-5 md:py-2.5 shadow-2xl flex items-center justify-center gap-2 border border-purple-400/40 backdrop-blur-sm active:scale-95 transition-all cursor-pointer"
          >
            <span id="play-icon" class="text-sm md:text-base">▶</span>
            <span id="play-text" class="text-xs md:text-sm font-bold">Ouvir Música</span>
          </button>

          <!-- Animação do Waveform -->
          <div class="absolute bottom-2 left-0 right-0 flex justify-center items-end gap-1 h-4 z-10 px-4">
            <div class="wave-bar w-1 bg-purple-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-indigo-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-cyan-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-purple-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-indigo-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-cyan-400 rounded-full"></div>
          </div>
        </div>

        <h2 id="song-title" class="text-xs md:text-sm font-bold text-white text-center truncate w-full mt-2 px-1">
          Luis Fonsi - Despacito ft. Daddy Yankee
        </h2>
        <div class="flex items-center justify-center gap-1 text-[10px] md:text-xs text-cyan-400 mt-0.5">
          <span>☑</span>
          <span>Áudio Original Detectado</span>
        </div>
      </div>

      <!-- OPÇÕES DE QUALIDADE DE ÁUDIO -->
      <div class="w-full md:w-1/2 flex flex-col justify-center gap-2">
        
        <div class="space-y-1.5">
          <span class="text-[10px] md:text-xs font-bold text-slate-300 uppercase tracking-wider block">Qualidade de Áudio para Download</span>
          <div class="grid grid-cols-2 gap-2">
            
            <!-- MP3 128kbps -->
            <label class="bg-[#121826] border border-slate-800 rounded-xl p-2.5 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-white">MP3 128kbps</span>
                <input type="radio" name="audio-quality" value="mp3-128" class="accent-purple-500">
              </div>
              <span class="text-[9px] md:text-[10px] text-slate-400 mt-1">Padrão</span>
            </label>

            <!-- MP3 320kbps -->
            <label class="bg-[#121826] border-2 border-purple-500/70 rounded-xl p-2.5 flex flex-col justify-between cursor-pointer bg-purple-950/20">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-white">MP3 320kbps</span>
                <input type="radio" name="audio-quality" value="mp3-320" checked class="accent-purple-500">
              </div>
              <span class="text-[9px] md:text-[10px] text-purple-300 mt-1">Alta Qualidade</span>
            </label>

            <!-- WAV 16-bit -->
            <label class="bg-[#121826] border border-slate-800 rounded-xl p-2.5 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-white">WAV 16-bit</span>
                <input type="radio" name="audio-quality" value="wav-16" class="accent-purple-500">
              </div>
              <span class="text-[9px] md:text-[10px] text-slate-400 mt-1">44.1kHz Qualidade CD</span>
            </label>

            <!-- WAV 24-bit -->
            <label class="bg-[#121826] border border-slate-800 rounded-xl p-2.5 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-white">WAV 24-bit</span>
                <input type="radio" name="audio-quality" value="wav-24" class="accent-purple-500">
              </div>
              <span class="text-[9px] md:text-[10px] text-slate-400 mt-1">48kHz Studio Master</span>
            </label>

          </div>
        </div>

      </div>

    </div>

    <!-- BOTÃO PRINCIPAL DE DOWNLOAD -->
    <div class="shrink-0 w-full my-auto">
      <button 
        onclick="downloadOriginalAudio()" 
        class="w-full neon-btn text-white font-extrabold py-3 md:py-3.5 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 uppercase tracking-wide cursor-pointer shadow-2xl"
      >
        <span>⬇ BAIXAR MÚSICA AGORA</span>
      </button>
    </div>

  </main>

  <!-- RODAPÉ FIXO COM CRÉDITOS DO DESENVOLVEDOR -->
  <footer class="px-4 py-2.5 text-center bg-[#070a12] border-t border-slate-800/60 shrink-0">
    <p class="text-[10px] md:text-[11px] text-slate-400">
      Aplicativo desenvolvido por 
      <a 
        href="https://www.instagram.com/rochasoulmusic" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="text-purple-400 font-bold hover:underline hover:text-purple-300 transition-colors inline-flex items-center gap-0.5"
      >
        @rochasoulmusic
      </a>
    </p>
  </footer>

  <!-- NOTIFICAÇÃO TOAST POPUP -->
  <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-purple-900 border border-purple-500 text-white text-xs px-4 py-2 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 whitespace-nowrap">
    Mensagem
  </div>

  <script>
    let isPlayingPreview = false;
    let ytPlayer = null;
    let currentVideoId = "kJQP7kiw5Fk";
    let audioStreamUrl = "";
    let deferredPrompt = null;

    const realAudioEl = document.getElementById('real-audio-element');

    // INICIALIZAR YOUTUBE PLAYER API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player-iframe', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const waveBars = document.querySelectorAll('.wave-bar');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlayingPreview = true;
        playIcon.innerText = "⏸";
        playText.innerText = "Pausar";
        waveBars.forEach(bar => bar.classList.add('animate-wave'));
      } else {
        if (realAudioEl && !realAudioEl.paused) return;
        isPlayingPreview = false;
        playIcon.innerText = "▶";
        playText.innerText = "Ouvir Música";
        waveBars.forEach(bar => bar.classList.remove('animate-wave'));
      }
    }

    // EXTRAÇÃO DE ID DO VÍDEO DO YOUTUBE
    function extractVideoId(url) {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
      return (match && match[1]) ? match[1] : null;
    }

    // BOTÃO COLAR
    async function pasteFromClipboard() {
      const urlInput = document.getElementById('url-input');
      let text = '';

      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        }
      } catch (err) {
        console.log('Permissão de clipboard restrita:', err);
      }

      if (!text || text.trim().length < 5) {
        text = prompt('Cole aqui o link do vídeo do YouTube:');
      }

      if (text && text.trim().length > 0) {
        urlInput.value = text.trim();
        handleUrlInputChange();
        showToast("Link colado com sucesso!");
      }
    }

    // PROCESSAMENTO DO LINK INSERIDO
    async function handleUrlInputChange() {
      const url = document.getElementById('url-input').value.trim();
      const videoId = extractVideoId(url);

      if (videoId && videoId !== currentVideoId) {
        currentVideoId = videoId;

        // Atualizar Capa da Música
        const thumbImg = document.getElementById('song-thumbnail');
        thumbImg.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
        thumbImg.onerror = () => {
          thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        };

        // Atualizar Iframe
        const iframe = document.getElementById('yt-player-iframe');
        iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&playsinline=1&controls=0&autoplay=0`;

        // Buscar Título Original via oEmbed
        try {
          const resp = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
          const data = await resp.json();
          if (data && data.title) {
            document.getElementById('song-title').innerText = data.title;
          }
        } catch(e) {
          document.getElementById('song-title').innerText = `Música do YouTube (${videoId})`;
        }

        fetchRealAudioStream(videoId);
        showToast("Música do link carregada!");
      }
    }

    // OBTER STREAM DE ÁUDIO REAL
    async function fetchRealAudioStream(videoId) {
      audioStreamUrl = "";
      const instances = [
        `https://inv.tux.pizza/api/v1/videos/${videoId}`,
        `https://invidious.nerdvpn.de/api/v1/videos/${videoId}`,
        `https://vid.puffyan.us/api/v1/videos/${videoId}`
      ];

      for (let inst of instances) {
        try {
          const res = await fetch(inst);
          const data = await res.json();
          if (data && data.adaptiveFormats) {
            const audioFormat = data.adaptiveFormats.find(f => f.mimeType && f.mimeType.startsWith('audio'));
            if (audioFormat && audioFormat.url) {
              audioStreamUrl = audioFormat.url;
              realAudioEl.src = audioStreamUrl;
              break;
            }
          }
        } catch(e) {}
      }
    }

    // OUVIR MÚSICA (Áudio Real do Vídeo)
    async function toggleAudioPreview() {
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const waveBars = document.querySelectorAll('.wave-bar');

      if (isPlayingPreview) {
        if (realAudioEl) realAudioEl.pause();
        if (ytPlayer && ytPlayer.pauseVideo) {
          try { ytPlayer.pauseVideo(); } catch(e) {}
        }
        isPlayingPreview = false;
        playIcon.innerText = "▶";
        playText.innerText = "Ouvir Música";
        waveBars.forEach(bar => bar.classList.remove('animate-wave'));
      } else {
        let played = false;

        if (realAudioEl && realAudioEl.src && realAudioEl.src.length > 10) {
          try {
            await realAudioEl.play();
            played = true;
          } catch(e) {}
        }

        if (!played && ytPlayer && ytPlayer.playVideo) {
          try {
            ytPlayer.playVideo();
            played = true;
          } catch(e) {}
        }

        isPlayingPreview = true;
        playIcon.innerText = "⏸";
        playText.innerText = "Pausar";
        waveBars.forEach(bar => bar.classList.add('animate-wave'));
        showToast("Reproduzindo áudio real do link!");
      }
    }

    // BAIXAR MÚSICA REAL DO YOUTUBE
    async function downloadOriginalAudio() {
      if (realAudioEl) realAudioEl.pause();
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();

      const rawTitle = document.getElementById('song-title').innerText;
      const cleanTitle = rawTitle.replace(/[^a-zA-Z0-9à-úÀ-Ú_\s-]/g, "").trim().replace(/\s+/g, "_") || "musica";
      const selectedQuality = document.querySelector('input[name="audio-quality"]:checked').value;
      const isWav = selectedQuality.startsWith('wav');
      const ext = isWav ? '.wav' : '.mp3';
      const filename = `${cleanTitle}${ext}`;

      showToast("Iniciando download da música...");

      if (audioStreamUrl) {
        try {
          const resp = await fetch(audioStreamUrl);
          const blob = await resp.blob();
          const downloadUrl = URL.revokeObjectURL ? URL.createObjectURL(blob) : audioStreamUrl;
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          if (URL.revokeObjectURL) URL.revokeObjectURL(downloadUrl);
          showToast(`Música salva nos Downloads: ${filename}`);
          return;
        } catch(e) {
          console.log("Download direto via CORS limitado, direcionando para extração de mídia...");
        }
      }

      // Redirecionamento seguro para extração HD de mídia do YouTube
      const cobaltUrl = `https://cobalt.tools/#https://www.youtube.com/watch?v=${currentVideoId}`;
      window.open(cobaltUrl, '_blank');
      showToast("Abrindo extração do áudio em alta qualidade...");
    }

    // BANNER PWA
    function closePWABanner() {
      document.getElementById('pwa-banner').style.display = 'none';
    }

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          closePWABanner();
        });
      } else {
        showToast("No Android: toque no menu (...) do navegador e 'Adicionar à Tela Inicial'");
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-banner').style.display = 'flex';
    });

    // TOAST MESSAGES
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      handleUrlInputChange();
    });
  </script>
</body>
</html>
