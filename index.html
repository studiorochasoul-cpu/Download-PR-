<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download music PRÓ</title>
  
  <!-- Manifest & PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e17">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #080c14;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .glass-card {
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-quality {
      border-color: #a855f7 !important;
      background: rgba(168, 85, 247, 0.15) !important;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-md flex items-center justify-between py-3 mb-2">
    <div class="flex items-center gap-3">
      <img src="icon.png" alt="Logo" class="w-9 h-9 rounded-xl shadow-lg border border-red-500/30">
      <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-red-500 via-pink-500 to-purple-500 bg-clip-text text-transparent">
        Music PRÓ
      </span>
    </div>
    
    <!-- Botão de Instalação (Exibido automaticamente quando elegível) -->
    <button id="installBtn" class="hidden text-xs bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition">
      <i data-lucide="download-cloud" class="w-4 h-4"></i> Instalar App
    </button>
  </header>

  <!-- Conteúdo Central -->
  <main class="w-full max-w-md flex flex-col gap-4 flex-1">

    <!-- Barra de Input URL -->
    <div class="relative flex items-center">
      <div class="absolute left-3.5 text-slate-400">
        <i data-lucide="link-2" class="w-5 h-5"></i>
      </div>
      <input 
        id="urlInput"
        type="text" 
        placeholder="Cole o link do YouTube aqui..." 
        class="w-full bg-[#111625] border border-slate-700/60 rounded-xl py-3.5 pl-11 pr-12 text-sm text-slate-100 focus:outline-none focus:border-purple-500 transition"
      >
      <button id="searchBtn" class="absolute right-2 p-2 bg-[#1d2436] hover:bg-purple-600 rounded-lg text-slate-300 hover:text-white transition">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Card de Mídia e Pré-escuta -->
    <div id="mediaCard" class="glass-card rounded-2xl p-4 flex flex-col gap-3 transition">
      <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-slate-900 border border-slate-800">
        <!-- Thumbnail -->
        <img id="videoThumb" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=60" alt="Capa da Música" class="w-full h-full object-cover">
        
        <!-- Player Oculto do YouTube -->
        <div id="ytPlayerContainer" class="hidden absolute inset-0 bg-black">
          <div id="player"></div>
        </div>

        <!-- Botão Play / Overlay -->
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
          <button id="playToggleBtn" class="w-14 h-14 rounded-full bg-purple-600/80 hover:bg-purple-600 flex items-center justify-center text-white backdrop-blur-sm border border-purple-400/40 transition transform active:scale-95">
            <i id="playIcon" data-lucide="play" class="w-7 h-7 fill-white ml-1"></i>
          </button>
        </div>
      </div>

      <!-- Títulos -->
      <div class="px-1">
        <h2 id="videoTitle" class="text-base font-bold text-white truncate">Cole um link para começar</h2>
        <p id="videoAuthor" class="text-xs text-slate-400 truncate">YouTube Music</p>
      </div>
    </div>

    <!-- Seção de Qualidade e Configuração de Download -->
    <div class="glass-card rounded-2xl p-4 flex flex-col gap-4">
      
      <!-- Opções MP3 -->
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">MP3 (Comprimido)</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="selectQuality(this, 'MP3 - 128 kbps')" class="quality-btn py-2.5 px-3 rounded-xl bg-[#111625] border border-slate-700/60 text-xs font-medium hover:border-purple-500 transition">
            128 kbps
          </button>
          <button onclick="selectQuality(this, 'MP3 - 320 kbps')" class="quality-btn active-quality py-2.5 px-3 rounded-xl bg-[#111625] border border-slate-700/60 text-xs font-medium hover:border-purple-500 transition">
            320 kbps
          </button>
        </div>
      </div>

      <!-- Opções WAV -->
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">WAV (Sem Perdas)</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="selectQuality(this, 'WAV - 16-bit / 44.1 kHz')" class="quality-btn py-2.5 px-3 rounded-xl bg-[#111625] border border-slate-700/60 text-left hover:border-purple-500 transition flex flex-col justify-center">
            <span class="text-xs font-medium text-slate-200">16-bit / 44.1 kHz</span>
            <span class="text-[10px] text-slate-400">Padrão CD</span>
          </button>
          <button onclick="selectQuality(this, 'WAV - 24-bit / 48 kHz')" class="quality-btn py-2.5 px-3 rounded-xl bg-[#111625] border border-slate-700/60 text-left hover:border-purple-500 transition flex flex-col justify-center">
            <span class="text-xs font-medium text-slate-200">24-bit / 48 kHz</span>
            <span class="text-[10px] text-slate-400">Qualidade Estúdio</span>
          </button>
        </div>
      </div>

      <!-- Botão Principal de Download -->
      <button id="downloadBtn" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-purple-900/30 transition transform active:scale-[0.98]">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span>BAIXAR MÚSICA</span>
      </button>

    </div>

  </main>

  <!-- Rodapé -->
  <footer class="w-full max-w-md py-4 text-center">
    <p class="text-[11px] text-slate-500">
      Aplicativo desenvolvido por 
      <a href="https://instagram.com/rochasoulmusic" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-purple-400 font-medium transition underline">
        @rochasoulmusic
      </a>
    </p>
  </footer>

  <!-- Scripts e Lógica da Aplicação -->
  <script>
    lucide.createIcons();

    // Estado da Aplicação
    let selectedQuality = "MP3 - 320 kbps";
    let currentVideoId = "";
    let isPlaying = false;
    let deferredPrompt = null;

    // PWA: Registro do Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // PWA: Captura do evento de instalação
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      installBtn.classList.remove('hidden');
      
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.classList.add('hidden');
          }
          deferredPrompt = null;
        }
      });
    });

    // Seleção de Qualidade
    function selectQuality(btn, quality) {
      document.querySelectorAll('.quality-btn').forEach(el => el.classList.remove('active-quality'));
      btn.classList.add('active-quality');
      selectedQuality = quality;
    }

    // Extração do Video ID do YouTube
    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\\&v=)([^#\\&\\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Processamento da URL
    const urlInput = document.getElementById('urlInput');
    const searchBtn = document.getElementById('searchBtn');
    const videoThumb = document.getElementById('videoThumb');
    const videoTitle = document.getElementById('videoTitle');
    const videoAuthor = document.getElementById('videoAuthor');
    const playToggleBtn = document.getElementById('playToggleBtn');
    const playIcon = document.getElementById('playIcon');

    async function handleURL() {
      const url = urlInput.value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        alert("Por favor, insira um link válido do YouTube.");
        return;
      }

      currentVideoId = videoId;
      videoThumb.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

      // Busca metadados públicos via noembed
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await res.json();
        videoTitle.textContent = data.title || "Música Identificada";
        videoAuthor.textContent = data.author_name || "Canal do YouTube";
      } catch (err) {
        videoTitle.textContent = "Áudio Selecionado";
        videoAuthor.textContent = "YouTube Music";
      }
    }

    searchBtn.addEventListener('click', handleURL);
    urlInput.addEventListener('change', handleURL);

    // Pré-escuta com Embed
    playToggleBtn.addEventListener('click', () => {
      if (!currentVideoId) {
        alert("Cole um link do YouTube antes de ouvir a prévia.");
        return;
      }
      const ytContainer = document.getElementById('ytPlayerContainer');
      
      if (!isPlaying) {
        ytContainer.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${currentVideoId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
        ytContainer.classList.remove('hidden');
        isPlaying = true;
        playToggleBtn.classList.add('opacity-0', 'hover:opacity-100');
      } else {
        ytContainer.innerHTML = '';
        ytContainer.classList.add('hidden');
        isPlaying = false;
        playToggleBtn.classList.remove('opacity-0', 'hover:opacity-100');
      }
    });

    // Ação do Botão Baixar Música
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!currentVideoId) {
        alert("Cole um link válido do YouTube antes de baixar.");
        return;
      }

      // Abre o endpoint de download configurado com as especificações escolhidas
      const targetUrl = `https://www.youtube.com/watch?v=${currentVideoId}`;
      const downloadServiceUrl = `https://loader.to/api/button/?url=${encodeURIComponent(targetUrl)}&f=${selectedQuality.includes('MP3') ? 'mp3' : 'wav'}`;
      
      window.open(downloadServiceUrl, '_blank');
    });
  </script>
</body>
</html>
