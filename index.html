<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download music PRÓ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #070a12;
      color: #f3f4f6;
    }
    .neon-btn {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }
    .neon-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3);
    }
    @keyframes pulse-wave {
      0%, 100% { height: 3px; }
      50% { height: 16px; }
    }
    .wave-bar {
      height: 3px;
      transition: height 0.3s;
    }
    .wave-bar.animate-wave {
      animation: pulse-wave 0.6s ease-in-out infinite alternate;
    }
    .wave-bar.animate-wave:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar.animate-wave:nth-child(3) { animation-delay: 0.25s; }
    .wave-bar.animate-wave:nth-child(4) { animation-delay: 0.4s; }
    .wave-bar.animate-wave:nth-child(5) { animation-delay: 0.15s; }
    .wave-bar.animate-wave:nth-child(6) { animation-delay: 0.3s; }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full bg-[#070a12] overflow-hidden">

  <!-- PLAYER EMBED OCULTO PARA REPRODUÇÃO REAL NO ANDROID E DESKTOP -->
  <div class="fixed top-0 left-0 -z-50 pointer-events-none opacity-0 w-1 h-1 overflow-hidden">
    <div id="yt-player"></div>
  </div>

  <!-- BANNER PWA DE INSTALAÇÃO -->
  <div id="pwa-banner" class="bg-gradient-to-r from-purple-900/90 to-indigo-900/90 border-b border-purple-500/30 px-3 py-1.5 flex items-center justify-between text-xs z-50 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded bg-red-600 flex items-center justify-center font-black text-[9px] text-white shadow">
        PRÓ
      </div>
      <span class="text-[11px] md:text-xs">Instalar <strong>Download music PRÓ</strong>?</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="installPWA()" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-2.5 py-0.5 rounded text-[11px] shadow">
        Instalar
      </button>
      <button onclick="closePWABanner()" class="text-slate-400 hover:text-white text-sm px-1">
        ✕
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="px-4 md:px-8 py-2 flex items-center justify-between border-b border-slate-800/80 bg-[#0b101d] shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="relative w-7 h-7 md:w-8 md:h-8 rounded-lg bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center shadow-lg border border-red-500/30">
        <svg class="w-3.5 h-3.5 text-white fill-current ml-0.5" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <span class="absolute -bottom-1 -right-1 bg-purple-600 text-[7px] font-black px-1 rounded text-white border border-slate-900">PRÓ</span>
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-extrabold tracking-tight text-white leading-none">Download music <span class="text-purple-400">PRÓ</span></h1>
        <p class="text-[8px] md:text-[10px] text-slate-400">Extração de áudio e transposição de tom</p>
      </div>
    </div>
    <div class="w-6 h-6 md:w-7 md:h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-purple-400 text-xs font-bold">
      👤
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (TELA ÚNICA SEM SCROLL / ADAPTÁVEL DESKTOP E MOBILE) -->
  <main class="flex-1 flex flex-col justify-between p-2.5 md:p-5 overflow-hidden max-w-4xl mx-auto w-full">

    <!-- CAMPO DE URL E BOTÃO COLAR -->
    <div class="shrink-0 w-full mb-2">
      <div class="relative flex items-center bg-[#121826] border border-purple-500/30 rounded-xl p-1.5 focus-within:border-purple-500 transition-all shadow-md">
        <span class="pl-2 pr-1 text-purple-400 text-xs md:text-sm">🔗</span>
        <input 
          type="text" 
          id="url-input" 
          placeholder="Cole o link do YouTube aqui..." 
          value="https://www.youtube.com/watch?v=kJQP7kiw5Fk"
          class="w-full bg-transparent text-xs md:text-sm text-white placeholder-slate-500 focus:outline-none px-1.5"
          oninput="handleUrlInputChange()"
        >
        <button 
          onclick="pasteFromClipboard()" 
          class="bg-purple-900/60 hover:bg-purple-800 text-purple-200 border border-purple-500/40 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition-all shrink-0 cursor-pointer"
        >
          📋 Colar
        </button>
      </div>
    </div>

    <!-- SEÇÃO CENTRAL: GRID COM CAPA/PLAYER E CONTROLES DIRETOS -->
    <div class="flex-1 flex flex-col md:flex-row items-center justify-center gap-2.5 md:gap-6 min-h-0 w-full my-auto">
      
      <!-- CAPA DA MÚSICA COM PLAYER DE ÁUDIO -->
      <div class="w-full md:w-1/2 flex flex-col items-center justify-center">
        <div class="relative w-full aspect-video max-h-[170px] md:max-h-[220px] rounded-xl overflow-hidden bg-black border border-slate-800 flex items-center justify-center shadow-lg">
          <img 
            id="song-thumbnail" 
            src="https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" 
            alt="Capa da música" 
            class="w-full h-full object-cover"
          >
          <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></div>

          <!-- Botão Ouvir Música -->
          <button 
            id="btn-play-preview"
            onclick="toggleAudioPreview()" 
            class="absolute z-10 bg-purple-600/90 hover:bg-purple-500 text-white rounded-full px-3.5 py-1.5 md:px-4 md:py-2 shadow-2xl flex items-center justify-center gap-1.5 border border-purple-400/40 backdrop-blur-sm active:scale-95 transition-all cursor-pointer"
          >
            <span id="play-icon" class="text-sm md:text-base">▶</span>
            <span id="play-text" class="text-[11px] md:text-xs font-bold">Ouvir Música</span>
          </button>

          <!-- Animação do Waveform -->
          <div class="absolute bottom-1.5 left-0 right-0 flex justify-center items-end gap-1 h-4 z-10 px-4">
            <div class="wave-bar w-1 bg-purple-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-indigo-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-cyan-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-purple-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-indigo-400 rounded-full"></div>
            <div class="wave-bar w-1 bg-cyan-400 rounded-full"></div>
          </div>
        </div>

        <h2 id="song-title" class="text-[11px] md:text-xs font-bold text-white text-center truncate w-full mt-1.5 px-1">
          Luis Fonsi - Despacito ft. Daddy Yankee
        </h2>
      </div>

      <!-- OPÇÕES DIRETAS (QUALIDADE DE ÁUDIO + TRANSPOSIÇÃO DE TOM) -->
      <div class="w-full md:w-1/2 flex flex-col justify-center gap-2">
        
        <!-- Opções de Qualidade de Áudio (Sem a tag PRO) -->
        <div class="space-y-1">
          <span class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Qualidade do Áudio</span>
          <div class="grid grid-cols-2 gap-1.5">
            
            <label class="bg-[#121826] border border-slate-800 rounded-lg p-1.5 md:p-2 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-[10px] md:text-xs font-bold text-white">MP3 128k</span>
                <input type="radio" name="audio-quality" value="mp3-128" class="accent-purple-500">
              </div>
              <span class="text-[8px] md:text-[9px] text-slate-400">Padrão</span>
            </label>

            <label class="bg-[#121826] border-2 border-purple-500/70 rounded-lg p-1.5 md:p-2 flex flex-col justify-between cursor-pointer bg-purple-950/20">
              <div class="flex items-center justify-between">
                <span class="text-[10px] md:text-xs font-bold text-white">MP3 320k</span>
                <input type="radio" name="audio-quality" value="mp3-320" checked class="accent-purple-500">
              </div>
              <span class="text-[8px] md:text-[9px] text-purple-300">Alta Fidelidade</span>
            </label>

            <label class="bg-[#121826] border border-slate-800 rounded-lg p-1.5 md:p-2 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-[10px] md:text-xs font-bold text-white">WAV 16-bit</span>
                <input type="radio" name="audio-quality" value="wav-16" class="accent-purple-500">
              </div>
              <span class="text-[8px] md:text-[9px] text-slate-400">44.1kHz CD</span>
            </label>

            <label class="bg-[#121826] border border-slate-800 rounded-lg p-1.5 md:p-2 flex flex-col justify-between cursor-pointer hover:border-purple-500/50 transition-all">
              <div class="flex items-center justify-between">
                <span class="text-[10px] md:text-xs font-bold text-white">WAV 24-bit</span>
                <input type="radio" name="audio-quality" value="wav-24" class="accent-purple-500">
              </div>
              <span class="text-[8px] md:text-[9px] text-slate-400">48kHz Master</span>
            </label>

          </div>
        </div>

        <!-- Transposição de Tom -->
        <div class="bg-[#121826] border border-slate-800 rounded-lg p-2">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[9px] md:text-[10px] font-bold text-slate-300 uppercase">Transposição de Tom</span>
            <div class="flex bg-slate-900 p-0.5 rounded border border-slate-800 text-[9px] md:text-[10px]">
              <button id="btn-orig" onclick="setTransposeMode('original')" class="px-2 py-0.5 rounded font-bold bg-purple-600 text-white cursor-pointer">Original</button>
              <button id="btn-trans" onclick="setTransposeMode('transpose')" class="px-2 py-0.5 rounded font-bold text-slate-400 cursor-pointer">Transpor</button>
            </div>
          </div>

          <div id="transpose-controls" class="flex items-center justify-between bg-[#1a2235] p-1.5 rounded border border-slate-700/50 opacity-50 pointer-events-none transition-all">
            <button onclick="changePitch(-1)" class="w-7 h-7 md:w-8 md:h-8 bg-slate-800 hover:bg-slate-700 active:scale-90 text-purple-300 rounded font-bold flex items-center justify-center border border-slate-700 text-sm md:text-base cursor-pointer">
              -
            </button>
            <div class="text-center">
              <div id="transpose-status" class="text-[10px] md:text-xs font-extrabold text-white">Tom Original (0)</div>
              <div id="transposed-key-display" class="text-[9px] md:text-[10px] text-purple-300">Bm (Si Menor)</div>
            </div>
            <button onclick="changePitch(1)" class="w-7 h-7 md:w-8 md:h-8 bg-slate-800 hover:bg-slate-700 active:scale-90 text-purple-300 rounded font-bold flex items-center justify-center border border-slate-700 text-sm md:text-base cursor-pointer">
              +
            </button>
          </div>
        </div>

      </div>

    </div>

    <!-- SEÇÃO INFERIOR: BOTÃO BAIXAR MÚSICA E COMPARTILHAMENTO -->
    <div class="shrink-0 space-y-2 mt-1">
      
      <!-- Botão Baixar Música Principal -->
      <button 
        onclick="downloadOriginalAudio()" 
        class="w-full neon-btn text-white font-extrabold py-2.5 md:py-3 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 uppercase tracking-wide cursor-pointer shadow-lg"
      >
        <span>⬇ BAIXAR MÚSICA</span>
      </button>

      <!-- Botões Compactos de Compartilhar -->
      <div class="flex items-center justify-center gap-3 md:gap-5 pt-0.5">
        <button onclick="shareMedia('WhatsApp')" class="flex items-center gap-1 text-[10px] md:text-xs text-slate-400 hover:text-green-400 cursor-pointer">
          <span>💬</span>
          <span>WhatsApp</span>
        </button>
        <span class="text-slate-700">•</span>
        <button onclick="shareMedia('Google Drive')" class="flex items-center gap-1 text-[10px] md:text-xs text-slate-400 hover:text-cyan-400 cursor-pointer">
          <span>☁️</span>
          <span>Drive</span>
        </button>
        <span class="text-slate-700">•</span>
        <button onclick="shareMedia('E-mail')" class="flex items-center gap-1 text-[10px] md:text-xs text-slate-400 hover:text-purple-400 cursor-pointer">
          <span>✉️</span>
          <span>Email</span>
        </button>
        <span class="text-slate-700">•</span>
        <button onclick="shareMedia('Mais')" class="flex items-center gap-1 text-[10px] md:text-xs text-slate-400 hover:text-white cursor-pointer">
          <span>•••</span>
          <span>Mais</span>
        </button>
      </div>

    </div>

  </main>

  <!-- RODAPÉ FIXO COM CRÉDITOS DO DESENVOLVEDOR -->
  <footer class="px-4 py-1.5 text-center bg-[#070a12] border-t border-slate-800/60 shrink-0">
    <p class="text-[10px] md:text-[11px] text-slate-400">
      Aplicativo desenvolvido por 
      <a 
        href="https://www.instagram.com/rochasoulmusic" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="text-purple-400 font-bold hover:underline hover:text-purple-300 transition-colors inline-flex items-center gap-0.5"
      >
        @rochasoulmusic
      </a>
    </p>
  </footer>

  <!-- NOTIFICAÇÃO TOAST POPUP -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-purple-900 border border-purple-500 text-white text-xs px-4 py-1.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 whitespace-nowrap">
    Mensagem
  </div>

  <!-- JAVASCRIPT DE FUNCIONAMENTO -->
  <script>
    let currentPitchShift = 0;
    let isTransposing = false;
    let isPlayingPreview = false;
    let ytPlayer = null;
    let currentVideoId = "kJQP7kiw5Fk";
    let detectedKeyIndex = 11; // Bm
    let deferredPrompt = null;

    const keysMap = [
      { code: 'C', pt: 'Dó Maior' },
      { code: 'C#', pt: 'Dó# Maior' },
      { code: 'D', pt: 'Ré Maior' },
      { code: 'D#', pt: 'Ré# Maior' },
      { code: 'E', pt: 'Mi Maior' },
      { code: 'F', pt: 'Fá Maior' },
      { code: 'F#', pt: 'Fá# Maior' },
      { code: 'G', pt: 'Sol Maior' },
      { code: 'G#', pt: 'Sol# Maior' },
      { code: 'A', pt: 'Lá Maior' },
      { code: 'A#', pt: 'Lá# Maior' },
      { code: 'B', pt: 'Si Maior' },
      { code: 'Cm', pt: 'Dó Menor' },
      { code: 'C#m', pt: 'Dó# Menor' },
      { code: 'Dm', pt: 'Ré Menor' },
      { code: 'D#m', pt: 'Ré# Menor' },
      { code: 'Em', pt: 'Mi Menor' },
      { code: 'Fm', pt: 'Fá Menor' },
      { code: 'F#m', pt: 'Fá# Menor' },
      { code: 'Gm', pt: 'Sol Menor' },
      { code: 'G#m', pt: 'Sol# Menor' },
      { code: 'Am', pt: 'Lá Menor' },
      { code: 'A#m', pt: 'Lá# Menor' },
      { code: 'Bm', pt: 'Si Menor' }
    ];

    // INICIALIZAR YOUTUBE PLAYER API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: currentVideoId,
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1,
          'origin': window.location.origin
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const waveBars = document.querySelectorAll('.wave-bar');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlayingPreview = true;
        playIcon.innerText = "⏸";
        playText.innerText = "Pausar";
        waveBars.forEach(bar => bar.classList.add('animate-wave'));
      } else {
        isPlayingPreview = false;
        playIcon.innerText = "▶";
        playText.innerText = "Ouvir Música";
        waveBars.forEach(bar => bar.classList.remove('animate-wave'));
      }
    }

    // EXTRAÇÃO DE ID DO YOUTUBE
    function extractVideoId(url) {
      if (!url) return null;
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
      return (match && match[1]) ? match[1] : null;
    }

    // BOTÃO COLAR
    async function pasteFromClipboard() {
      const urlInput = document.getElementById('url-input');
      let text = '';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        }
      } catch (err) {}

      if (!text || text.trim().length < 5) {
        text = prompt('Cole o link da música do YouTube:');
      }

      if (text && text.trim().length > 0) {
        urlInput.value = text.trim();
        handleUrlInputChange();
        showToast("Link colado com sucesso!");
      }
    }

    // PROCESSAMENTO DO LINK
    async function handleUrlInputChange() {
      const url = document.getElementById('url-input').value.trim();
      const videoId = extractVideoId(url);

      if (videoId && videoId !== currentVideoId) {
        currentVideoId = videoId;

        // Atualizar Capa
        const thumbImg = document.getElementById('song-thumbnail');
        thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

        // Carregar Vídeo no Player
        if (ytPlayer && ytPlayer.cueVideoById) {
          try {
            ytPlayer.cueVideoById(videoId);
          } catch(e) {}
        }

        // Buscar Título Original
        try {
          const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
          const data = await resp.json();
          if (data && data.title) {
            document.getElementById('song-title').innerText = data.title;
          }
        } catch(e) {
          document.getElementById('song-title').innerText = `Música do YouTube (${videoId})`;
        }

        // Resetar transposição
        currentPitchShift = 0;
        updateTransposeDisplay();
        showToast("Música carregada!");
      }
    }

    // OUVIR MÚSICA
    function toggleAudioPreview() {
      if (!ytPlayer || !ytPlayer.playVideo) {
        showToast("Iniciando reprodutor...");
        return;
      }

      if (isPlayingPreview) {
        ytPlayer.pauseVideo();
      } else {
        try {
          ytPlayer.playVideo();
          showToast("Reproduzindo áudio original...");
        } catch(e) {
          showToast("Toque novamente para tocar");
        }
      }
    }

    // MODO TRANSPOSIÇÃO DE TOM
    function setTransposeMode(mode) {
      const btnOrig = document.getElementById('btn-orig');
      const btnTrans = document.getElementById('btn-trans');
      const controls = document.getElementById('transpose-controls');

      if (mode === 'transpose') {
        isTransposing = true;
        btnTrans.className = "px-2 py-0.5 rounded font-bold bg-purple-600 text-white cursor-pointer";
        btnOrig.className = "px-2 py-0.5 rounded font-bold text-slate-400 cursor-pointer";
        controls.classList.remove('opacity-50', 'pointer-events-none');
      } else {
        isTransposing = false;
        btnOrig.className = "px-2 py-0.5 rounded font-bold bg-purple-600 text-white cursor-pointer";
        btnTrans.className = "px-2 py-0.5 rounded font-bold text-slate-400 cursor-pointer";
        controls.classList.add('opacity-50', 'pointer-events-none');
        currentPitchShift = 0;
        updateTransposeDisplay();
      }
    }

    // ALTERAR TOM (- / +)
    function changePitch(delta) {
      if (!isTransposing) return;
      currentPitchShift += delta;
      updateTransposeDisplay();
      showToast(`Tom alterado (${currentPitchShift > 0 ? '+' : ''}${currentPitchShift} semitono)`);
    }

    function updateTransposeDisplay() {
      const status = document.getElementById('transpose-status');
      const keyDisp = document.getElementById('transposed-key-display');

      const origKeyObj = keysMap[detectedKeyIndex];
      let isMinorKey = origKeyObj.code.includes('m');
      let baseIdx = detectedKeyIndex % 12;
      let newIdx = (baseIdx + currentPitchShift) % 12;
      if (newIdx < 0) newIdx += 12;
      if (isMinorKey) newIdx += 12;

      const targetKeyObj = keysMap[newIdx];
      const prefix = currentPitchShift > 0 ? `+${currentPitchShift}` : `${currentPitchShift}`;
      
      status.innerText = currentPitchShift === 0 ? "Tom Original (0)" : `Transposição (${prefix} semitom${Math.abs(currentPitchShift) > 1 ? 's' : ''})`;
      keyDisp.innerText = `${targetKeyObj.code} (${targetKeyObj.pt})`;
    }

    // BAIXAR O ÁUDIO ORIGINAL DIRETO
    function downloadOriginalAudio() {
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();

      const rawTitle = document.getElementById('song-title').innerText;
      const cleanTitle = rawTitle.replace(/[^a-zA-Z0-9à-úÀ-Ú_\s-]/g, "").trim().replace(/\s+/g, "_") || "musica";
      const selectedQuality = document.querySelector('input[name="audio-quality"]:checked').value;
      const isWav = selectedQuality.startsWith('wav');
      const ext = isWav ? 'wav' : 'mp3';

      showToast(`Iniciando download do áudio original (${ext.toUpperCase()})...`);

      // Redirecionamento de extração direta de alta definição
      const downloadServiceUrl = `https://cobalt.tools/#https://www.youtube.com/watch?v=${currentVideoId}`;
      window.open(downloadServiceUrl, '_blank');
    }

    // COMPARTILHAMENTO
    function shareMedia(platform) {
      const title = document.getElementById('song-title').innerText;
      if (navigator.share) {
        navigator.share({
          title: 'Download music PRÓ',
          text: `Baixe "${title}" com o Download music PRÓ!`,
          url: `https://www.youtube.com/watch?v=${currentVideoId}`,
        }).catch(() => {});
      } else {
        showToast(`Compartilhando via ${platform}...`);
      }
    }

    // BANNER PWA
    function closePWABanner() {
      document.getElementById('pwa-banner').style.display = 'none';
    }

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          closePWABanner();
        });
      } else {
        showToast("No Android: toque no menu (...) e selecione 'Adicionar à Tela Inicial'");
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-banner').style.display = 'flex';
    });

    // MENSAGEM TOAST
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
